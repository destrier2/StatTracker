<!doctype html>
<html lang="en-US">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width" />
		<title>Stats</title>
		<link rel="manifest" href="manifest.json" />
		<link rel="stylesheet" href="style.css" />
		
	</head>
		<body>
			<div id="ifOffline" style="position:fixed; width:100%; bottom:0; left:0; display:none;">
				<p style="background-color:gray;margin:0; color:yellow;">⚠︎ You are currently offline ⚠︎</p>
			</div>
			<h1>Frisbee stats tracker - Home</h1>
			<button id = "addTeam" class = "mainMenu" type="button" onclick="document.location='newTeam.html'">Create Team</button> 
			<button id = "viewTeam" class = "mainMenu" type="button" onclick="document.location='viewTeam.html'">View Team</button>
			<button id = "addGame" class = "mainMenu" type="button" onclick="document.location='newGame.html'">Add Game</button>
			<button id = "addPlayer" class = "mainMenu" type="button" onclick="document.location='newPlayer.html'">Add Player</button>
			<button id = "viewPlayers" class = "mainMenu" type="button" onclick="document.location='viewPlayers.html'">View Players</button>
			<button id = "viewGames" class = "mainMenu" type="button" onclick="document.location='viewGames.html'">View Games</button>
			<br>
			<!-- <button id="changeColorButton" type="button">Change colors</button> -->
			<br><br>
			<input id="colorPicker" type="color" value="#f7cac9" style="width:75px; height:75px;display:inline-block;margin:none;">
			<input id="borderColor" type="color" disabled style="width:75px; height:75px;display:inline-block;margin:none;border-color:#767676">
			<input id="bgColorPicker" type="color" value="#ffffff" style="width:75px; height:75px;display:inline-block;margin:none;">
			<!-- 
			<div id="hiddenColorStuff" style="display:none">
				
			</div>
			-->
			<br><br>
			<button id="clearStorage" type="button">Clear storage</button>
			<button id="viewStorage" type="button">View storage</button>
			<!-- <button id="clearSS" type="button" onclick="sessionStorage.clear()">Clear Session storage</button> -->
			
			<script src="script.js" defer></script>
		<!-- Register the app's service worker. -->
		<script>
		  if ("serviceWorker" in navigator) {
		    navigator.serviceWorker.register("serviceworker.js");
		  }
		</script>

	</body>
</html>
