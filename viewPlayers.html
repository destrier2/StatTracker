<!doctype html>
<html lang="en-US">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width" />
		<title>Add Team</title>
		<link rel="manifest" href="manifest.json" />
		<link rel="stylesheet" href="style.css" />
	</head>
		<body>
			<div id="ifOffline" style="position:fixed; width:100%; bottom:0; left:0; display:none;">
				<p style="background-color:gray;margin:0; color:yellow;">⚠︎ You are currently offline ⚠︎</p>
			</div>
			<h1>Frisbee stats tracker - View all players</h1>
			<button id="toHome" type="button" class="mainMenu" onclick="document.location='index.html'">Back to Home</button>
            <div>
				<p>All players: </p>
				<table id = "allPlayers">
					<tr>
						<th>Player</th>
						<th>#</th>
						<th>O/W</th>
						<th>Pulls</th>
						<th>TA</th>
						<th>D</th>
						<th>G</th>
						<th>A</th>
						<th>2A</th>
						<th>RE</th>
					</tr>
				</table> 
			</div>
			<br><br>
            <button id="addPlayer" type="button" onclick="document.location='newPlayer.html'">Add a player</button>
			<br><br>
			<!-- This allows users to edit the player name, number, stats etc in case of an input error -->
			<button id="editPlayer" type="button">Edit a player</button>
			<div id="editPlayerHiddenStuff" style="display:none;"> 
				<br>
				<fieldset style="background-color:lightgray;">
				<form id="formEditPlayer"><br>
					<label for="playerName">Name of player: </label>
					<input type="text" id="playerName" required /> <br><br>
					<label for="dropdown">What would you like to modify?</label>
					<select id="dropdown">
						<option value="name">Name</option>
						<option value="number">Number</option>
						<option value="gender">Gender</option>
						<option value="pulls">Pulls</option>
						<option value="throwaways">Throwaways</option>
						<option value="ds">Ds</option>
						<option value="goals">Goals</option>
						<option value="assists">Assists</option>
						<option value="secondAssists">Second assists</option>
						<option value="receiverError">Receiver error</option>
					</select>
					<br><br>
					<label for="newValue">Enter the new value: </label>
					<input id="newValue" type="text" required />
					<br><br>
					<button type="submit">Submit</button>
				</fieldset>
				</form>
			</div>
			<br><br>
			<button id="removePlayer" type="button" class="delete">Remove a player</button>
			<br><br>
			<div id="removePlayerHiddenStuff" style="display:none;">
				<form id="formRemovePlayer">
					<fieldset>
						<br>
						<label for="removePlayerName">Player name: </label>
						<input id="removePlayerName" required /><br><br>
						<button id="remove" type="submit" class="delete">Remove player</button>
						<button id="cancelRemove" type="button">Cancel</button>
					</fieldset>
				</form>
			</div>
			<script src="scriptViewPlayers.js" defer></script>
		</body>
</html>
